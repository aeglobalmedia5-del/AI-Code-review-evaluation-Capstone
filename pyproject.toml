[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-review-evaluation"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "python-dotenv>=1.0"]

[project.optional-dependencies]
evaluation = ["deepeval>=3.0.0", "ragas>=0.3.0,<1.0", "openai>=1.0"]
redteam = ["deepteam>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
